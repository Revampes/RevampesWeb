<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Revampes</title>

    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/components/sidebar.css">
    <link rel="stylesheet" href="../css/components/loader.css">
    <link rel="stylesheet" href="../css/components/animations.css">
    <link rel="stylesheet" href="../css/project.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
</head>
<body>
<div aria-label="Orange and tan hamster running in a metal wheel" role="img" class="wheel-and-hamster">
        <div class="hamster-wrapper">
            <div class="wheel"></div>
            <div class="hamster">
                <div class="hamster__body">
                    <div class="hamster__head">
                        <div class="hamster__ear"></div>
                        <div class="hamster__eye"></div>
                        <div class="hamster__nose"></div>
                    </div>
                    <div class="hamster__limb hamster__limb--fr"></div>
                    <div class="hamster__limb hamster__limb--fl"></div>
                    <div class="hamster__limb hamster__limb--br"></div>
                    <div class="hamster__limb hamster__limb--bl"></div>
                    <div class="hamster__tail"></div>
                </div>
            </div>
            <div class="spoke"></div>
        </div>
    </div>

<nav class="navbar">
    <div class="nav-container">
        <a href="../../index.html" class="logo">
            <i class="fas fa-code"></i>
            <span class="main-name">Revampes</span>
        </a>
        <div class="nav-links">
            <a href="about.html" class="nav-link">About</a>
            <span class="separator">/</span>
            <a href="project.html" class="nav-link active">Projects</a>
            <span class="separator">/</span>
            <a href="aftertimefault.html" class="nav-link">AfterTimeFault</a>
            <span class="separator">/</span>
            <a href="equipments.html" class="nav-link">Equipments</a>
            <span class="separator">/</span>
            <a href="contacts.html" class="nav-link">Contacts</a>
        </div>
        <button id="theme-toggle" class="theme-toggle">
            <i class="fas fa-sun"></i>
        </button>
        <button class="hamburger" id="hamburger" aria-label="Open navigation" style="display:none">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</nav>

<div class="sidebar" id="sidebar">
    <button class="sidebar-close" id="sidebar-close" aria-label="Close navigation">
        <i class="fas fa-times"></i>
    </button>
    <a href="about.html" class="nav-link">About</a>
    <span class="separator">/</span>
    <a href="project.html" class="nav-link">Projects</a>
    <span class="separator">/</span>
    <a href="aftertimefault.html" class="nav-link">AfterTimeFault</a>
    <span class="separator">/</span>
    <a href="equipments.html" class="nav-link">Equipments</a>
    <span class="separator">/</span>
    <a href="contacts.html" class="nav-link">Contacts</a>
</div>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<main class="page-content project-page">
    <div class="project-container">
        <div class="header-image-container project-header-canvas">
            <div class="project-header-canvas-wrapper fade-in neon-hero">
                <canvas id="projectParticleCanvas" class="particle-bg"></canvas>
                <div class="neon-effect"></div>
                <div class="project-header-title">Projects</div>
                <img src="../images/DoggiePic2.png" alt="Doggie" class="project-doggie-image">
            </div>
        </div>
        
        <!-- Category Filter -->
        <div class="category-filter">
            <button class="category-btn active" data-category="all">All</button>
            <button class="category-btn" data-category="programming">Programming</button>
            <button class="category-btn" data-category="art">Arts</button>
            <button class="category-btn" data-category="documentation">Documentation</button>
        </div>

        <!-- Search Bar -->
        <div class="project-search">
            <div class="search-bar">
                <input type="text" placeholder="Search by title, description, or tags..." id="repo-search">
                <button class="search-btn"><i class="fas fa-search"></i></button>
            </div>
        </div>

        <!-- Active Tags Display -->
        <div class="active-tags" id="active-tags"></div>

        <div class="projects-grid-section">
            <div class="projects-grid" id="projects-grid">
                <!-- Projects will be inserted here by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Image Modal for Arts -->
    <div class="image-modal" id="image-modal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close" id="modal-close"><i class="fas fa-times"></i></button>
            <img src="" alt="" id="modal-image">
        </div>
    </div>
</main>

<footer class="footer animate-in">
    <p>Copyright Observed by Revampes © 2025</p>
    <p>Build with HTML5, CSS & JavaScript</p>
</footer>

<script src="../javascript/particle-bg.js"></script>
<script src="../javascript/index.js"></script>
<script src="../javascript/project.js"></script>
<script src="../javascript/common-utils.js"></script>
</body>
</html>
